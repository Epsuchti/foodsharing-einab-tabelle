message.automation.cleaning-override=Hey {0}\n\nDu hast am {1} einen Abholslot bei {2} gebucht. Bei diesem Betrieb gilt die allgemein geltende Reinigungspflicht: Jedes Mitglied soll alle 6 Monate einen Fairteiler reinigen. Diese Automatisierung setzt diese Pflicht derzeit erst nach {3} ohne Reinigung durch.\n\n{4}\n\nDaher würden wir dich normalerweise aus dem Abholslot austragen. Da aktuell jedoch nur noch {5} freie Reinigungsslots verfügbar sind, lassen wir dich dieses Mal ausnahmsweise im Slot eingetragen.\n\nAktuell sind folgende Reinigungsslots frei:\n\n{6}\n\nBitte buche einen passenden Reinigungsslot hier:\n{7}
message.automation.cleaning-new-user=Hey {0}\n\nDu hast am {1} einen Abholslot bei {2} gebucht.\n\nDie offizielle Reinigungspflicht lautet: Jedes Mitglied soll alle 6 Monate einen Fairteiler reinigen. Die Automatisierung setzt diese Regel bei dir erst durch, wenn seit deiner Verifizierung ein Zeitraum von {3} vergangen ist.\n\nDu bist seit dem {4} bei Foodsharing verifiziert. Bis zum {5} musst du deshalb noch keine Reinigung nachweisen.\n\nWenn du bis dahin keinen Fairteiler gereinigt hast, musst du danach eine Reinigung einplanen, bevor du wieder Abholslots buchen kannst.\n\nSlots buchen hier: {6}.
message.automation.cleaning-required=Bei diesem Betrieb gilt die allgemein geltende Reinigungspflicht: Jedes Mitglied soll alle 6 Monate einen Fairteiler reinigen. Diese Automatisierung setzt diese Pflicht derzeit erst nach {3} ohne Reinigung durch.\n\nDu hast in den letzten {0} keinen Fairteiler geputzt. {1} Zudem hast du keine zukünftige Reinigung geplant. Bitte trage dich für eine Reinigung ein, damit du weiterhin abholen kannst. Buch dir doch einen der freien Reinigungsslots. Slots buchen hier: {4}.
